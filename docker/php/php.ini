; Production PHP configuration, shared by the app and console images.
;
; No xdebug: it is absent from these images entirely. Under worker mode the
; extension hooks the engine on every opcode and cancels out most of what
; worker mode buys, so it belongs only in the local dev stack.

[PHP]
expose_php = off

; Errors go to the container log, never to the response body.
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
log_errors = On
error_log = /dev/stderr

; In worker mode a single PHP process serves many requests, so treat this as a
; ceiling for the worker rather than for one request. Workers are recycled on
; --max-requests (see the app CMD) so slow growth cannot accumulate forever.
memory_limit = 512M

max_execution_time = 120
post_max_size = 200M
upload_max_filesize = 200M

date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000

; The image is immutable, so the source cannot change under a running process.
; Skipping the per-include stat() is free performance here. This is the one
; setting that must be revisited if code is ever bind-mounted into the image.
opcache.validate_timestamps = 0
